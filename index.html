<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 壁纸</title>
    <meta name="description" content="发现 AI 创作的壁纸，收藏喜欢的画面，与创作者分享灵感。" />
    <style id="theme-preload">html{visibility:hidden}</style>
    <script>
      (function(){
        try {
          var saved = localStorage.getItem('theme');
          var html = document.documentElement;
          if (saved === 'dark') { html.classList.add('dark'); }
          else if (saved === 'light') { html.classList.remove('dark'); }
          else {
            html.classList.add('dark');
          }
          var s = document.getElementById('theme-preload');
          if (s) s.parentNode.removeChild(s);
        } catch {} finally { document.getElementById("theme-preload")?.remove(); }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
